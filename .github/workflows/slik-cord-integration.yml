name: Slik.Cord tests

on:
  push:
    branches: [ master ]
    paths:
      - 'src/SlikCord/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/SlikCord/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2 
    - name: Set up .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to Registry
      uses: docker/login-action@v1
      with:       
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}
        
    - name: Build and push .NET 10 container
      uses: docker/build-push-action@v2
      with:
        push: true
        file: src/SlikCord/Dockerfile
        tags: ghcr.io/insvald/slik-cord:10.0
    - name: Start container for .NET 10
      run: docker run -d -p 3099:3100 ghcr.io/insvald/slik-cord:10.0
    - name: Restore, build and test .NET 10
      run: dotnet test tests/SlikCord.IntegrationTests --framework net10.0
